services:
  app-node:
    image: node:25-alpine
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "30010:3010"
    environment:
      DB_HOST: postgres-bdd
      DB_PORT: 5432
      DB_USER: david
      DB_PW: hello
      DB_NAME: epsi-test-ci
      PORT: 3010
    command: sh -c "npm install && npm run dev"
    depends_on:
      - postgres-bdd

  postgres-bdd:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: david
      POSTGRES_PASSWORD: hello
      POSTGRES_DB: epsi-test-ci
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:5.4.2
    ports:
      - "8080:8080"
    depends_on:
      - postgres-bdd

volumes:
    postgres_data: