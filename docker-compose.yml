services:
  app-node:
    image: node:25-alpine
    ports:
      - "30010:3010"
    depends_on:
      - postgres-bdd

  postgres-bdd:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: david
      POSTGRES_PASSWORD: hello
      POSTGRES_DB: epsi-test-ci
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:5.4.2
    ports:
      - "8080:8080"
    depends_on:
      - postgres-bdd

volumes:
    postgres_data: